
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comida Wiki</title>
    <script type="module" src="/src/main.js"></script>
  </head>

  <body>
    <main id="app">
      <h1 id="comida">COMIDA WIKI</h1>

      <div id="buscador">
        <label for="selecComida">¿Qué comida quieres buscar?</label>

        <div>
          <input type="text" id="selecComida"/>
          <button id="buscarComida" type="button">
            BUSCAR
          </button>
        </div>
      </div>
      <div>
        <label for="selectorCategorias">Filtrar por categoría:</label>
        <select id="selectorCategorias">
          <option value="">Selecciona una categoría</option>
        </select>
      </div>
      <div id="tituloComida"></div>

      <div id="resultados"></div>
    </main>
  </body>
</html>
