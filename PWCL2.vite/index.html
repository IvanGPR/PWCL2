
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cocktail Wiki</title>
    <script type="module" src="/src/main.js"></script>
  </head>

  <body>
    <main id="app">
      <h1 id="cocktails">COCKTAIL WIKI</h1>

      <div id="buscador">
        <label for="selecCocktail">¿Que cocktail quieres buscar?</label>

        <div>
          <input type="text" id="selecCocktail" />
          <button id="buscarCocktail" type="button">
            BUSCAR
          </button>
        </div>
      </div>

      <div>
        <label for="selectorCategorias">Filtrar por categoria:</label>
        <select id="selectorCategorias">
          <option value="">Selecciona una categoria</option>
        </select>
      </div>

      <div id="tituloCocktail"></div>

      <div id="resultados"></div>
    </main>
  </body>
</html>
